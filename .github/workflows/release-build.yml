name: release-build

on:
    push:
        branches:
            - release
    workflow_dispatch:

concurrency:
    group: release-build-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        environment: env
        permissions:
            contents: read
            packages: write

        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20.x"
                  registry-url: "https://npm.pkg.github.com"
                  scope: "@hypubdy"

            - name: Use Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.3.14"

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Lint
              run: bun run lint

            - name: Build
              run: bun run build

            - name: Test call module
              run: npm run test:call

            - name: Set GitHub Packages metadata
              id: meta
              run: |
                  BASE=$(node -p "require('./package.json').version")
                  VERSION="${BASE}-build.${{ github.run_number }}"
                  npm pkg set name="@hypubdy/zca-js" version="$VERSION" \
                      repository.url="git+https://github.com/${{ github.repository }}.git" \
                      publishConfig.registry="https://npm.pkg.github.com"
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"

            - name: Verify PACKAGES_TOKEN
              env:
                  T: ${{ secrets.PACKAGES_TOKEN }}
              run: |
                  if [ -z "$T" ]; then echo "::warning::PACKAGES_TOKEN is missing; falling back to GITHUB_TOKEN"; exit 0; fi
                  echo "scopes: $(curl -sI -H "Authorization: token $T" https://api.github.com/user | grep -i '^x-oauth-scopes' | cut -d: -f2-)"
                  echo "login: $(curl -s -H "Authorization: token $T" https://api.github.com/user | node -p 'JSON.parse(require("fs").readFileSync(0)).login')"

            - name: Publish to GitHub Packages
              env:
                  # Classic PAT with write:packages; GITHUB_TOKEN is rejected for new packages on this fork.
                  NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
              run: |
                  npm publish --tag latest
                  echo "Published @hypubdy/zca-js@${{ steps.meta.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
