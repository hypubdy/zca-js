name: release-build

on:
    push:
        branches:
            - release
    workflow_dispatch:

concurrency:
    group: release-build-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20.x"

            - name: Use Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.3.14"

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Lint
              run: bun run lint

            - name: Build
              run: bun run build

            - name: Test call module
              run: npm run test:call

            - name: Pack package
              id: pack
              run: |
                  TARBALL=$(npm pack --silent | tail -n 1)
                  echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
                  echo "Packed $TARBALL"

            - name: Upload package artifact
              uses: actions/upload-artifact@v4
              with:
                  name: zca-js-${{ github.sha }}
                  path: ${{ steps.pack.outputs.tarball }}
                  if-no-files-found: error
                  retention-days: 30

            - name: Publish GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  TAG="v${VERSION}-build.${{ github.run_number }}"
                  cp "${{ steps.pack.outputs.tarball }}" zca-js.tgz
                  gh release create "$TAG" zca-js.tgz \
                      --target "${{ github.sha }}" \
                      --title "zca-js $TAG" \
                      --notes "Built from release@${{ github.sha }}" \
                      --prerelease
                  echo "Install: https://github.com/${{ github.repository }}/releases/download/$TAG/zca-js.tgz" >> "$GITHUB_STEP_SUMMARY"
