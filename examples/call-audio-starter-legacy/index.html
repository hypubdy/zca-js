<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Audio Call Starter</title>
    <style>
      body { margin: 0; font: 16px system-ui, sans-serif; background: #f4f7fb; color: #17243a; }
      main { max-width: 680px; margin: 48px auto; padding: 28px; background: white; border: 1px solid #dce5ef; border-radius: 16px; }
      h1 { margin-top: 0; }
      label { display: block; margin: 20px 0 8px; }
      select, button { font: inherit; padding: 10px 14px; border-radius: 8px; }
      select { min-width: 260px; border: 1px solid #b9c6d8; }
      button { border: 0; color: white; background: #2475e8; cursor: pointer; }
      button:disabled { opacity: .5; cursor: not-allowed; }
      .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      .status { margin: 18px 0; padding: 14px; background: #f4f7fb; border-radius: 10px; }
      .error { color: #b42332; }
      .incoming { border: 1px solid #f0c881; background: #fff8e9; padding: 16px; border-radius: 10px; }
      small { color: #65748b; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
