<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Audio Call Starter</title>
    <style>
      body { margin: 0; font: 16px system-ui, sans-serif; background: #f4f7fb; color: #17243a; }
      main { max-width: 680px; margin: 32px auto; padding: 24px; background: white; border: 1px solid #dce5ef; border-radius: 16px; }
      h1 { margin-top: 0; }
      select, button { font: inherit; padding: 10px 14px; border-radius: 8px; }
      select { min-width: 260px; border: 1px solid #b9c6d8; }
      button { border: 0; color: white; background: #2475e8; cursor: pointer; }
      button.danger { background: #c4314b; }
      button:disabled { opacity: .45; cursor: not-allowed; }
      .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
      .status { padding: 12px; background: #f4f7fb; border-radius: 10px; }
      .incoming { border: 1px solid #f0c881; background: #fff8e9; padding: 14px; border-radius: 10px; }
      .error { color: #b42332; }
      pre { font-size: 12px; background: #0f1724; color: #cfe3ff; padding: 10px; border-radius: 8px; max-height: 220px; overflow: auto; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <h1>Gọi thoại Zalo</h1>
      <div class="status" id="status">Đang kết nối backend…</div>
      <section id="login">
        <div class="row"><button id="btn-login">Liên kết Zalo (QR)</button></div>
        <img id="qr" width="220" height="220" alt="QR đăng nhập Zalo" hidden />
      </section>
      <section id="online" hidden>
        <div class="row">
          <select id="friends"><option value="">— chọn bạn —</option></select>
          <button id="btn-dial">Gọi thoại</button>
        </div>
        <div class="incoming" id="incoming" hidden>
          <strong>Cuộc gọi đến</strong> từ <span id="incoming-peer"></span>
          <div class="row"><button id="btn-answer">Nghe (mic trình duyệt)</button><button class="danger" id="btn-reject">Từ chối</button></div>
        </div>
        <div class="row">
          <button class="danger" id="btn-hangup" disabled>Kết thúc</button>
          <label><input type="checkbox" id="mute" /> Tắt mic</label>
        </div>
        <div id="stats"></div>
      </section>
      <p class="error" id="error"></p>
      <audio id="remote" autoplay></audio>
      <pre id="log"></pre>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
